<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoMent — Vaccines</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2">
        <img src="logo.png" class="w-9 h-9 rounded-full object-cover" alt="MoMent Logo">
        <span class="font-semibold">MoMent</span>
      </a>
      <nav class="hidden md:flex items-center gap-1 text-sm">
        <a href="reminders.html" class="px-3 py-2 rounded-xl hover:bg-slate-100 flex items-center gap-2 text-slate-600">
          <svg class="w-5 h-5"><use href="#bell"></use></svg>Reminders
        </a>
        <a href="appointments.html" class="px-3 py-2 rounded-xl hover:bg-slate-100 flex items-center gap-2 text-slate-600">
          <svg class="w-5 h-5"><use href="#calendar"></use></svg>Appointments
        </a>
        <a href="vaccines.html" class="px-3 py-2 rounded-xl bg-slate-100 text-violet-700 font-semibold flex items-center gap-2">
          <svg class="w-5 h-5"><use href="#vial"></use></svg>Vaccines
        </a>
      </nav>
    </div>
  </header>

  <main class="flex-1">
    <section class="max-w-5xl mx-auto px-4 md:px-6 py-6 grid gap-6">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h1 class="text-2xl font-semibold">Vaccine log</h1>
        <p class="text-sm text-slate-500 mt-1">Keep track of what Baby Pete has received and which shots are coming next.</p>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <h2 class="font-semibold mb-3">Add vaccine</h2>
        <form id="vaccineForm" class="grid gap-3 md:grid-cols-2">
          <label class="grid gap-1 text-sm">
            <span class="text-slate-500">Name</span>
            <input id="vacName" class="rounded-xl border px-3 py-2" placeholder="e.g., Rotavirus #1" required />
          </label>
          <label class="grid gap-1 text-sm">
            <span class="text-slate-500">Status</span>
            <select id="vacStatus" class="rounded-xl border px-3 py-2">
              <option value="scheduled">Scheduled</option>
              <option value="completed">Completed</option>
              <option value="skipped">Skipped</option>
            </select>
          </label>
          <label class="grid gap-1 text-sm">
            <span class="text-slate-500">Date (optional)</span>
            <input id="vacDate" type="date" class="rounded-xl border px-3 py-2" />
          </label>
          <label class="grid gap-1 text-sm">
            <span class="text-slate-500">Location</span>
            <input id="vacLocation" class="rounded-xl border px-3 py-2" placeholder="Clinic or hospital" />
          </label>
          <label class="md:col-span-2 grid gap-1 text-sm">
            <span class="text-slate-500">Notes</span>
            <textarea id="vacNotes" rows="3" class="rounded-xl border px-3 py-2" placeholder="Observation, caregiver, side effects..."></textarea>
          </label>
          <div class="md:col-span-2 flex justify-end gap-2">
            <button type="reset" class="rounded-xl border px-4 py-2 text-sm">Reset</button>
            <button type="submit" class="rounded-xl bg-violet-600 text-white px-4 py-2 text-sm">Save vaccine</button>
          </div>
        </form>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-3">
          <h2 class="font-semibold">History</h2>
          <button id="markAllCompleteBtn" class="rounded-xl border px-3 py-2 text-sm">Mark scheduled as completed</button>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="text-left text-slate-500">
              <tr>
                <th class="py-2 pr-4">Name</th>
                <th class="py-2 pr-4">Status</th>
                <th class="py-2 pr-4">Date</th>
                <th class="py-2 pr-4">Location</th>
                <th class="py-2 pr-4">Notes</th>
                <th class="py-2 pr-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="vaccinesTable" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
        <div id="vaccinesEmpty" class="hidden rounded-xl border border-dashed border-slate-300 p-6 text-sm text-slate-500 text-center mt-3">
          No vaccines logged yet — use the form above to get started.
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-white border-t">
    <div class="max-w-5xl mx-auto px-4 py-3 text-xs text-slate-500 flex justify-between">
      <span>MoMent — vaccines</span>
      <a href="index.html" class="text-violet-600">Back to dashboard</a>
    </div>
  </footer>

  <svg aria-hidden="true" class="hidden">
    <symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 6-3 8h18c0-2-3-1-3-8m-5 13a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><path d="M7 2v3m10-3v3m-13 4h16M4 6h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="vial" viewBox="0 0 24 24"><path d="M7 2h10v4H7zM6 6h12l-1 14H7z" /></symbol>
  </svg>

  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden rounded-xl bg-slate-900 text-white px-4 py-2 text-sm shadow-lg"></div>
  <script type="module" src="assets/js/vaccines.js"></script>
</body>
</html>
